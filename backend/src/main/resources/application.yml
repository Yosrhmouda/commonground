server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: commonground
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/commonground;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
      file-size-threshold: 0
app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}
  secure-cookies: ${SECURE_COOKIES:false}
